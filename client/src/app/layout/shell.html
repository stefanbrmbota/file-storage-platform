<header class="header">
  <div class="header__inner">
    <a class="brand" routerLink="/">File Storage</a>
    @if (tokens.isAuthenticated()) {
      <nav class="nav" aria-label="Glavna navigacija">
        @for (item of nav; track item.path) {
          <a
            class="nav__link"
            [routerLink]="item.path"
            routerLinkActive="nav__link--active"
            [routerLinkActiveOptions]="{ exact: item.path === '/' }"
            >{{ item.label }}</a
          >
        }
      </nav>
      <button type="button" class="logout" (click)="logout()" [disabled]="loggingOut()">Odjavi se</button>
    } @else {
      <a class="nav__link login-link" routerLink="/prijava">Prijava</a>
    }
  </div>
</header>

<main class="content">
  @if (errors.message(); as message) {
    <div class="error-banner" role="alert">
      <span>{{ message }}</span>
      <button type="button" class="error-banner__close" (click)="errors.dismiss()" aria-label="Zatvori poruku">×</button>
    </div>
  }
  <router-outlet />
</main>
