# nginx za Angular klijent (T-32.1). Sluša na 8080 (image bez root prava).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Adresa gateway-a; pravi je docker/40-config-json.sh pri pokretanju.
    location = /config.json {
        alias /tmp/app-config/config.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # index.html se ne kešira, da posle nove verzije pretraživač uzme nove fajlove.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Angular rutiranje: nepoznata putanja vraća index.html, a ruter prikazuje stranicu.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
