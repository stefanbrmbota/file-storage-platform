# nginx za Angular klijent (T-32.1). Image je bez root prava, pa su portovi iznad 1024.
#
# HTTPS (US-67): aplikacija se služi samo preko TLS-a na 8443. Sertifikat i
# ključ (certs/ u root-u repoa, pravi ih api-gateway/cmd/devcert) se montiraju
# u /certs. Običan HTTP zahtev na TLS port preusmerava se na https (497).
server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /certs/localhost.crt;
    ssl_certificate_key /certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:1m;
    ssl_session_timeout 10m;

    # http://localhost:3000 → https://localhost:3000
    error_page 497 =301 https://$http_host$request_uri;

    server_tokens off;
    # HSTS: pretraživač posle prve posete sam koristi https za ovaj host.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Adresa gateway-a; pravi je docker/40-config-json.sh pri pokretanju.
    # (add_header u location bloku poništava one iz server bloka, pa se ponavljaju.)
    location = /config.json {
        alias /tmp/app-config/config.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # index.html se ne kešira, da posle nove verzije pretraživač uzme nove fajlove.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Angular rutiranje: nepoznata putanja vraća index.html, a ruter prikazuje stranicu.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Healthcheck kontejnera (T-33.3): samo unutar kontejnera, bez TLS-a, nije
# objavljen napolje. Ne služi aplikaciju.
server {
    listen 127.0.0.1:8080;
    server_tokens off;
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
    location / {
        return 404;
    }
}
